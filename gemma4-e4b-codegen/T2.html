<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ブロック崩しゲーム</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #gameCanvas {
            border: 5px solid #333;
            background-color: #eee;
            cursor: none; /* マウスカーソルを非表示にしてゲーム感を出す */
        }
        #scoreBoard {
            margin-top: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        .game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 30px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>ブロック崩し</h1>
    <canvas id="gameCanvas" width="600" height="450"></canvas>
    <div id="scoreBoard">スコア: 0</div>

    <script>
        // ===============================================
        // 定数設定
        // ===============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreBoard');

        // ゲーム要素のサイズと初期値
        const paddleWidth = 75;
        const paddleHeight = 10;
        let ballRadius = 8;
        let ballX = canvas.width / 2;
        let ballY = canvas.height - 30;
        let dx = 4; // x方向の速度
        let dy = -4; // y方向の速度 (上に向かう)

        // パドル初期位置
        let paddleX = (canvas.width - paddleWidth) / 2;
        let paddleY = canvas.height - 30;
        const paddleSpeed = 7;

        // ブロック設定
        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = 65;
        const brickHeight = 15;
        const brickPadding = 8;
        let bricks = [];
        let score = 0;

        // ゲーム状態管理
        let gameRunning = true;
        let keysPressed = {};

        // ===============================================
        // 初期化関数
        // ===============================================

        function initializeBricks() {
            bricks = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[r][c] = { x: 0, y: 0, status: 1 }; // status=1 は存在
                }
            }
        }

        function resetGame() {
            // 初期位置と速度をリセット
            ballX = canvas.width / 2;
            ballY = canvas.height - 30;
            dx = Math.random() > 0.5 ? 4 : -4; // ランダムな初期方向
            dy = -4;

            paddleX = (canvas.width - paddleWidth) / 2;
            score = 0;
            gameRunning = true;
            keysPressed = {};
            scoreDisplay.textContent = `スコア: ${score}`;
            initializeBricks();
        }

        // ブロックの配置計算と初期描画位置設定
        function calculateBrickPositions() {
            const totalWidth = brickColumnCount * (brickWidth + brickPadding);
            const startX = (canvas.width - totalWidth) / 2;
            const startY = 30;

            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[r][c].x = startX + c * (brickWidth + brickPadding);
                    bricks[r][c].y = startY + r * (brickHeight + brickPadding);
                }
            }
        }

        // ===============================================
        // 描画関数
        // ===============================================

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#FF4500"; // オレンジ色
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, paddleY, paddleWidth, paddleHeight);
            ctx.fillStyle = "#3333CC"; // 青色
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    const brick = bricks[r][c];
                    if (brick.status === 1) {
                        const x = brick.x;
                        const y = brick.y;
                        ctx.beginPath();
                        ctx.rect(x, y, brickWidth, brickHeight);
                        // 行によって色を変えるなど、視覚的な工夫が可能
                        let color = (r % 2 === 0) ? '#FF6347' : '#FFA07A'; // トマト/サーモンピンク
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // ===============================================
        // 衝突判定とロジック
        // ===============================================

        function collisionDetection() {
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    const brick = bricks[r][c];
                    if (brick.status === 1) {
                        // ボールがブロックの範囲内かチェック
                        if (ballX > brick.x && ballX < brick.x + brickWidth &&
                            ballY > brick.y && ballY < brick.y + brickHeight) {

                            // 衝突発生！
                            brick[r][c].status = 0; // ブロックを消す
                            score += 10;
                            scoreDisplay.textContent = `スコア: ${score}`;

                            // ボールの跳ね返り処理 (垂直方向の速度を反転)
                            dy = -dy;
                        }
                    }
                }
            }
        }

        function handleWallCollision() {
            // 左右の壁との衝突
            if (ballX + dx * 1 > canvas.width - ballRadius || ballX + dx * 1 < ballRadius) {
                dx = -dx;
            }
            // 上の天井との衝突
            if (ballY + dy * 1 < ballRadius) {
                dy = -dy;
            }
        }

        function handlePaddleCollision() {
            // ボールがパドルと重なっているかチェック
            if (ballY + ballRadius > paddleY &&
                ballX > paddleX &&
                ballX < paddleX + paddleWidth) {

                // 衝突判定をより厳密に行うため、ボールの現在の位置を使用
                if (dy > 0 && ballY + ballRadius * 2 >= paddleY && ballY + ballRadius * 2 <= paddleY + paddleHeight) {
                    // パドルに当たった場合
                    dy = -dy;

                    // 衝突したX座標に基づいて、跳ね返りの角度を調整する（よりリアルな反射）
                    let relativeIntersectX = (paddleX + (paddleWidth / 2)) - ballX;
                    let normalizedRelativeIntersectionX = relativeIntersectX / (paddleWidth / 2);
                    dx = normalizedRelativeIntersectionX * -1.5; // 反射の強さ調整
                }
            }
        }

        function handleBottomCollision() {
            // 下の床（ゲームオーバー）との衝突
            if (ballY + ballRadius > canvas.height - 20) {
                gameRunning = false;
                showGameMessage("GAME OVER", "キーを押してリトライ");
            }
        }

        function checkWinCondition() {
             // 全てのブロックが消えたかチェック
            let bricksLeft = 0;
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    if (bricks[r][c].status === 1) {
                        bricksLeft++;
                    }
                }
            }

            if (bricksLeft === 0 && gameRunning) {
                gameRunning = false;
                showGameMessage("CLEAR!", "おめでとう！クリアです！");
            }
        }


        // ===============================================
        // メインゲームループ
        // ===============================================

        function draw() {
            if (!gameRunning && !document.getElementById('messageOverlay')) return; // ゲームオーバー/クリア時は描画しない

            // 1. キャンバスをクリア
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. 要素の描画
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // 3. 衝突判定と移動ロジック
            handleWallCollision();
            handlePaddleCollision();
            handleBottomCollision();

            // パドルの移動（キー入力に基づく）
            if (keysPressed['ArrowLeft'] && paddleX > 0) {
                paddleX -= paddleSpeed;
            } else if (keysPressed['ArrowRight'] && paddleX < canvas.width - paddleWidth) {
                paddleX += paddleSpeed;
            }

            // ボールの移動
            ballX += dx;
            ballY += dy;

            // 4. ゲーム状態チェック
            checkWinCondition();

            // 次のフレームをリクエスト
            requestAnimationFrame(draw);
        }


        // ===============================================
        // イベントハンドラとUI制御
        // ===============================================

        document.addEventListener("keydown", e => {
            keysPressed[e.key] = true;
            if (['ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); // スクロール防止
            }
        });

        document.addEventListener("keyup", e => {
            keysPressed[e.key] = false;
        });


        function showGameMessage(title, message) {
            // 既存のメッセージをクリア
            const existingMessage = document.getElementById('messageOverlay');
            if (existingMessage) existingMessage.remove();

            // 新しいオーバーレイを作成
            const overlay = document.createElement('div');
            overlay.id = 'messageOverlay';
            overlay.className = 'game-message';
            overlay.innerHTML = `<h2>${title}</h2><p>${message}</p><button id="restartButton" style="margin-top: 20px; padding: 10px 20px; font-size: 20px; cursor: pointer;">再試行</button>`;
            document.body.appendChild(overlay);

            // 再試行ボタンのイベントリスナーを設定
            document.getElementById('restartButton').onclick = () => {
                resetGame();
                draw(); // ゲームループを再開
            };
        }


        // ===============================================
        // ゲーム開始処理
        // ===============================================

        window.onload = () => {
            calculateBrickPositions();
            resetGame();
            // 初回描画とゲームループの開始
            draw(); 
        };

    </script>
</body>
</html>
