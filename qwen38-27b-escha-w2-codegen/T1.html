<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDo App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
    background: #f4f5f7;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .app {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .app-header {
    padding: 20px;
    text-align: center;
    background: #4a69bd;
    color: #fff;
  }
  .app-header h1 { font-size: 1.4rem; }

  .input-row {
    display: flex;
    padding: 16px;
    gap: 8px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }
  .input-row button {
    padding: 10px 18px;
    background: #4a69bd;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
  }
  .input-row button:hover { background: #3a53a0; }

  .filters {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
  }
  .filters button {
    padding: 6px 14px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .filters button.active {
    background: #4a69bd;
    color: #fff;
    border-color: #4a69bd;
  }

  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid #eee;
  }
  li input[type="checkbox"] { width: 18px; height: 18px; }

  .task-text {
    flex: 1;
    cursor: pointer;
    word-break: break-word;
  }
  li.completed .task-text {
    text-decoration: line-through;
    color: #999;
  }

  .edit-input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #4a69bd;
    border-radius: 4px;
    font-size: 1rem;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #c0392b;
    font-size: 1.1rem;
    cursor: pointer;
  }

  .footer {
    padding: 12px 16px;
    font-size: 0.9rem;
    color: #666;
    border-top: 1px solid #eee;
  }

  .empty {
    padding: 20px;
    text-align: center;
    color: #999;
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-header"><h1>ToDo</h1></div>

  <div class="input-row">
    <input type="text" id="task-input" placeholder="タスクを入力してください" autocomplete="off">
    <button id="add-btn">追加</button>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">すべて</button>
    <button data-filter="active">未完了</button>
    <button data-filter="completed">完了</button>
  </div>

  <ul id="task-list"></ul>

  <div class="footer" id="footer">未完了: 0</div>
</div>

<script>
(function () {
  var STORAGE_KEY = "todo-app-tasks";
  var tasks = [];
  var filter = "all";

  // localStorageから読み込み
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) tasks = JSON.parse(saved);
  } catch (e) { tasks = []; }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render() {
    var list = document.getElementById("task-list");
    list.innerHTML = "";

    var visible = tasks.filter(function (t) {
      if (filter === "active") return !t.completed;
      if (filter === "completed") return t.completed;
      return true;
    });

    if (visible.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "タスクがありません";
      list.appendChild(empty);
    }

    visible.forEach(function (task) {
      var li = document.createElement("li");
      if (task.completed) li.classList.add("completed");

      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.completed;
      checkbox.addEventListener("change", function () {
        task.completed = checkbox.checked;
        save();
        render();
      });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;
      span.title = "ダブルクリックで編集";
      span.addEventListener("dblclick", function () {
        startEdit(li, task);
      });

      var del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "✕";
      del.title = "削除";
      del.addEventListener("click", function () {
        tasks = tasks.filter(function (t) { return t !== task; });
        save();
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });

    var remaining = tasks.filter(function (t) { return !t.completed; }).length;
    document.getElementById("footer").textContent = "未完了: " + remaining;
  }

  function startEdit(li, task) {
    var span = li.querySelector(".task-text");
    var input = document.createElement("input");
    input.className = "edit-input";
    input.value = task.text;
    li.replaceChild(input, span);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    function commit() {
      var value = input.value.trim();
      if (value !== "") {
        task.text = value;
      }
      save();
      render();
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        input.blur();
      } else if (e.key === "Escape") {
        input.onblur = null;
        render();
      }
    });
    input.addEventListener("blur", commit);
  }

  // 追加
  var input = document.getElementById("task-input");
  var addBtn = document.getElementById("add-btn");

  function addTask() {
    var text = input.value.trim();
    if (!text) return;
    tasks.push({ text: text, completed: false });
    input.value = "";
    save();
    render();
    input.focus();
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });

  // フィルタ
  document.querySelectorAll(".filters button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".filters button").forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      filter = btn.dataset.filter;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
