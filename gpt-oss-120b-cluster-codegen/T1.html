<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シンプル ToDo アプリ</title>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0 1rem;
        line-height: 1.5;
    }
    h1 {
        text-align: center;
        margin-top: 1.5rem;
    }
    #input-area {
        display: flex;
        justify-content: center;
        margin: 1rem 0;
    }
    #new-task {
        width: 70%;
        max-width: 400px;
        padding: .5rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    #add-btn {
        margin-left: .5rem;
        padding: .5rem 1rem;
        font-size: 1rem;
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    #add-btn:hover { background: #218838; }
    #todo-list {
        list-style: none;
        padding: 0;
        max-width: 600px;
        margin: 0 auto;
    }
    .todo-item {
        display: flex;
        align-items: center;
        background: #fff;
        margin-bottom: .5rem;
        padding: .5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    .todo-item.completed .task-text {
        text-decoration: line-through;
        color: #777;
    }
    .task-text {
        flex: 1;
        margin: 0 .5rem;
        cursor: pointer;
    }
    .delete-btn {
        background: transparent;
        border: none;
        color: #dc3545;
        font-weight: bold;
        cursor: pointer;
    }
    .delete-btn:hover { color: #c82333; }
    #footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 600px;
        margin: 1rem auto;
        font-size: .9rem;
        color: #555;
    }
    #filters button {
        background: transparent;
        border: none;
        margin: 0 .3rem;
        cursor: pointer;
        color: #555;
    }
    #filters .selected { font-weight: bold; text-decoration: underline; }
</style>
</head>
<body>

<h1>ToDo リスト</h1>

<div id="input-area">
    <input type="text" id="new-task" placeholder="タスクを入力してください">
    <button id="add-btn">追加</button>
</div>

<ul id="todo-list"></ul>

<div id="footer">
    <span id="remaining">0 件の未完了タスク</span>
    <div id="filters">
        <button class="filter selected" data-filter="all">すべて</button>
        <button class="filter" data-filter="active">未完了</button>
        <button class="filter" data-filter="completed">完了</button>
    </div>
</div>

<script>
/* ---------- データ管理 ---------- */
const STORAGE_KEY = 'todo-items';
let todos = [];               // {id, text, completed}
let currentFilter = 'all';    // all / active / completed

/* ---------- 初期化 ---------- */
document.addEventListener('DOMContentLoaded', () => {
    loadFromStorage();
    render();

    // 追加ボタン
    document.getElementById('add-btn').addEventListener('click', addTask);
    // Enter キーでも追加
    document.getElementById('new-task').addEventListener('keypress', e => {
        if (e.key === 'Enter') addTask();
    });

    // フィルタ切替
    document.querySelectorAll('#filters .filter').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('#filters .selected').classList.remove('selected');
            btn.classList.add('selected');
            currentFilter = btn.dataset.filter;
            render();
        });
    });
});

/* ---------- ローカルストレージ ---------- */
function loadFromStorage() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
        try { todos = JSON.parse(data); }
        catch (e) { console.error('JSON parse error', e); todos = []; }
    }
}
function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

/* ---------- タスク操作 ---------- */
function addTask() {
    const input = document.getElementById('new-task');
    const text = input.value.trim();
    if (!text) return;
    const newItem = {
        id: Date.now(),
        text,
        completed: false
    };
    todos.push(newItem);
    input.value = '';
    saveAndRender();
}
function toggleComplete(id) {
    const item = todos.find(t => t.id === id);
    if (item) {
        item.completed = !item.completed;
        saveAndRender();
    }
}
function deleteTask(id) {
    todos = todos.filter(t => t.id !== id);
    saveAndRender();
}
function editTask(id, newText) {
    const item = todos.find(t => t.id === id);
    if (item && newText.trim()) {
        item.text = newText.trim();
        saveAndRender();
    }
}

/* ---------- 描画 ---------- */
function render() {
    const list = document.getElementById('todo-list');
    list.innerHTML = '';

    const filtered = todos.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true; // all
    });

    filtered.forEach(item => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (item.completed ? ' completed' : '');
        li.dataset.id = item.id;

        // チェックボックス
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.completed;
        cb.addEventListener('change', () => toggleComplete(item.id));
        li.appendChild(cb);

        // テキスト (ラベル)
        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = item.text;
        span.title = 'ダブルクリックで編集';
        // ダブルクリックで編集モードへ
        span.addEventListener('dblclick', () => startEdit(span, item.id));
        li.appendChild(span);

        // 削除ボタン
        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.title = '削除';
        del.addEventListener('click', () => deleteTask(item.id));
        li.appendChild(del);

        list.appendChild(li);
    });

    // 未完了件数表示
    const remaining = todos.filter(t => !t.completed).length;
    document.getElementById('remaining').textContent = `${remaining} 件の未完了タスク`;
}

/* ---------- 編集モード ---------- */
function startEdit(labelElem, id) {
    const originalText = labelElem.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = originalText;
    input.style.width = '90%';
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            finishEdit();
        } else if (e.key === 'Escape') {
            cancelEdit();
        }
    });
    input.addEventListener('blur', finishEdit);
    labelElem.replaceWith(input);
    input.focus();

    function finishEdit() {
        const newText = input.value.trim();
        if (newText && newText !== originalText) editTask(id, newText);
        cancelEdit();
    }
    function cancelEdit() {
        labelElem.textContent = originalText;
        input.replaceWith(labelElem);
    }
}

/* ---------- 保存 & 描画のまとめ ---------- */
function saveAndRender() {
    saveToStorage();
    render();
}
</script>

</body>
</html>
