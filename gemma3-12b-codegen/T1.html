<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoアプリ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        #todo-list {
            margin-top: 20px;
        }

        .task {
            display: flex;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .task input[type="checkbox"] {
            margin-right: 10px;
        }

        .task a {
            text-decoration: none;
            color: red;
            margin-left: 10px;
        }

        .completed {
            opacity: 0.5;
        }

        #filters button {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>ToDoリスト</h1>

    <div id="new-task">
        <input type="text" id="todo-input" placeholder="タスクを入力...">
        <button id="add-button">追加</button>
    </div>

    <div id="filters">
        <button data-filter="all">すべて</button>
        <button data-filter="incomplete">未完了</button>
        <button data-filter="completed">完了</button>
    </div>

    <div id="todo-list">
        <!-- タスクはここに動的に追加されます -->
    </div>

    <p>未完了タスク: <span id="remaining-count">0</span></p>


    <script>
        let todos = [];
        const todoInput = document.getElementById('todo-input');
        const addButton = document.getElementById('add-button');
        const todoList = document.getElementById('todo-list');
        const filters = document.querySelectorAll('#filters button');
        const remainingCountSpan = document.getElementById('remaining-count');

        // ローカルストレージからデータを読み込む
        function loadTodos() {
            const storedTodos = localStorage.getItem('todos');
            if (storedTodos) {
                todos = JSON.parse(storedTodos);
                renderTodoList();
            }
        }

        // タスクをレンダリングする
        function renderTodoList() {
            todoList.innerHTML = ''; // リストをクリア

            todos.forEach((todo, index) => {
                const taskElement = document.createElement('div');
                taskElement.classList.add('task');
                taskElement.dataset.index = index;  //インデックスをデータ属性として保存

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.addEventListener('change', toggleComplete);

                const taskText = document.createElement('span');
                taskText.textContent = todo.text;
                if (todo.completed) {
                    taskText.classList.add('completed');
                }
                taskText.addEventListener('dblclick', editTask);


                const deleteLink = document.createElement('a');
                deleteLink.href = '#';
                deleteLink.textContent = '削除';
                deleteLink.addEventListener('click', deleteTask);

                taskElement.appendChild(checkbox);
                taskElement.appendChild(taskText);
                taskElement.appendChild(deleteLink);

                todoList.appendChild(taskElement);
            });

            updateRemainingCount();
        }


        // タスクを追加する
        function addTask() {
            const text = todoInput.value.trim();
            if (text !== '') {
                todos.push({ text: text, completed: false });
                saveTodos(); // 追加したらすぐに保存
                renderTodoList();
                todoInput.value = '';  // 入力欄をクリア
            }
        }

        // タスクの完了状態を切り替える
        function toggleComplete(event) {
            const index = event.target.parentNode.dataset.index;
            todos[index].completed = !todos[index].completed;
            saveTodos();
            renderTodoList();
        }


        // タスクを削除する
        function deleteTask(event) {
            event.preventDefault();
            const index = event.target.parentNode.dataset.index;
            todos.splice(index, 1);
            saveTodos();
            renderTodoList();
        }

        // タスクの編集
        function editTask(event) {
            event.preventDefault();
            const index = event.target.parentNode.dataset.index;
            const oldText = todos[index].text;

            const inputElement = document.createElement('input');
            inputElement.type = 'text';
            inputElement.value = oldText;
            event.target.parentNode.appendChild(inputElement);
            inputElement.focus();

            inputElement.addEventListener('blur', () => {
                const newText = inputElement.value.trim();
                todos[index].text = newText;
                saveTodos();
                renderTodoList();
                inputElement.remove(); //編集用inputを削除
            });

            inputElement.addEventListener('keydown', (e) => {
              if(e.key === 'Enter'){
                  const newText = inputElement.value.trim();
                  todos[index].text = newText;
                  saveTodos();
                  renderTodoList();
                  inputElement.remove(); //編集用inputを削除
              }
            });

        }


        // フィルタリング
        function filterTodos(filterType) {
            const taskElements = document.querySelectorAll('.task');
            taskElements.forEach(task => {
                const checkbox = task.querySelector('input[type="checkbox"]');
                if (filterType === 'all') {
                    task.style.display = '';
                } else if (filterType === 'incomplete' && !checkbox.checked) {
                    task.style.display = '';
                } else if (filterType === 'completed' && checkbox.checked) {
                    task.style.display = '';
                } else {
                    task.style.display = 'none';
                }
            });
        }

        // 未完了タスクの数を更新する
        function updateRemainingCount() {
            const incompleteTasks = todos.filter(todo => !todo.completed).length;
            remainingCountSpan.textContent = incompleteTasks;
        }


        // ローカルストレージにデータを保存する
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // イベントリスナーの設定
        addButton.addEventListener('click', addTask);
        todoInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') addTask(); }); // Enterキーで追加

        filters.forEach(button => {
            button.addEventListener('click', () => {
                const filter = button.dataset.filter;
                filterTodos(filter);
            });
        });


        // 初期化
        loadTodos();
    </script>
</body>
</html>
